server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /index.html =404;
  }

  location = /index.html {
    return 301 /;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # HTML/CSS/JS: revalida sempre (via ETag). Assim, logo apos um deploy
  # o navegador ja pega a versao nova em vez de servir cache antigo.
  location ~* \.(?:html|css|js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Imagens/fontes: cache curto (1h) — cobre banners com nome fixo que
  # podem ter o conteudo trocado; uploads do painel ja tem nome unico.
  location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}