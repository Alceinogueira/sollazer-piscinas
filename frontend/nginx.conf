server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressão: HTML/CSS/JS/JSON chegam bem menores pro navegador.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # "location = /" é a raiz exata (o que todo visitante acessa de verdade,
  # ninguém digita /index.html) e tem prioridade sobre os outros blocos —
  # sem Cache-Control aqui, o navegador podia guardar uma versão antiga da
  # página indefinidamente (cache "heurístico"), sem nunca checar se mudou.
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    return 301 /;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # HTML/CSS/JS: revalida sempre (via ETag). Assim, logo apos um deploy
  # o navegador ja pega a versao nova em vez de servir cache antigo.
  location ~* \.(?:html|css|js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Imagens/fontes: cache curto (1h) — cobre banners com nome fixo que
  # podem ter o conteudo trocado; uploads do painel ja tem nome unico.
  location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}