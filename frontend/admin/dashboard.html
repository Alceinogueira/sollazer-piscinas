<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do funcionário | Sollazer Piscinas</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <header class="admin-header"><div class="admin-header__inner">
    <img src="../assets/IMG-20260820-WA0128-removebg-preview.png" alt="Sollazer Piscinas">
    <button id="logoutButton" type="button">Sair</button>
  </div></header>
  <main class="admin-main">
    <h1>Painel da loja</h1>
    <p class="admin-subtitle">Olá, <span id="adminName">funcionário</span>. Gerencie produtos e ofertas.</p>
    <div class="admin-grid">
      <section class="admin-card">
        <h2 id="productFormTitle">Adicionar produto</h2>
        <form class="admin-form" id="productForm">
          <input type="hidden" id="productId">
          <div class="admin-form__grid">
            <label>Nome<input id="productName" required maxlength="150"></label>
            <label>Preço<input id="productPrice" type="number" min="0" step="0.01" required></label>
            <label>Estoque<input id="productStock" type="number" min="0" step="1" value="0"></label>
            <label>Tipo de ação<select id="productAction"><option value="carrinho">Adicionar ao carrinho</option><option value="orcamento">Solicitar orçamento</option></select></label>
            <label class="full">Descrição<textarea id="productDescription"></textarea></label>
            <label>Marca<input id="productBrand" maxlength="80"></label>
            <label>Categoria<input id="productCategory" maxlength="80"></label>
            <label class="full">URL da foto<input id="productImage" type="url" placeholder="https://..." required></label>
            <label>Visível<select id="productActive"><option value="true">Sim</option><option value="false">Não</option></select></label>
          </div>
          <div class="admin-form__actions"><button class="admin-button" type="submit">Salvar produto</button><button class="admin-button secondary" id="productCancel" type="button">Limpar</button></div>
          <p class="admin-message" id="productMessage" role="alert"></p>
        </form>
        <div class="admin-list" id="productList"></div>
      </section>
      <section class="admin-card">
        <h2 id="offerFormTitle">Adicionar oferta ao carrossel</h2>
        <form class="admin-form" id="offerForm">
          <input type="hidden" id="offerId">
          <div class="admin-form__grid">
            <label class="full">Título<input id="offerTitle" required maxlength="180"></label>
            <label class="full">Subtítulo<input id="offerSubtitle" maxlength="255"></label>
            <label class="full">Descrição<textarea id="offerDescription"></textarea></label>
            <label class="full">URL da imagem<input id="offerImage" type="url" placeholder="https://..." required></label>
            <label>Link do botão<input id="offerLink" value="#produtos"></label>
            <label>Ordem<input id="offerOrder" type="number" min="0" value="0"></label>
            <label>Visível<select id="offerActive"><option value="true">Sim</option><option value="false">Não</option></select></label>
          </div>
          <div class="admin-form__actions"><button class="admin-button" type="submit">Salvar oferta</button><button class="admin-button secondary" id="offerCancel" type="button">Limpar</button></div>
          <p class="admin-message" id="offerMessage" role="alert"></p>
        </form>
        <div class="admin-list" id="offerList"></div>
      </section>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
